<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exchange — Currency Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F1E7;
    --panel: #FFFDF8;
    --ink: #1B2A41;
    --ink-soft: #5B6577;
    --line: #DED4BF;
    --gold: #B8862F;
    --gold-soft: #EFE1C4;
    --teal: #3B6E62;
    --rust: #A23E2E;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #171512;
      --panel: #221F1A;
      --ink: #F1EADA;
      --ink-soft: #B9AF9B;
      --line: #3A3328;
      --gold: #D9A94A;
      --gold-soft: #3A2F1C;
      --teal: #74A896;
      --rust: #D97B69;
    }
  }
  :root[data-theme="dark"] {
    --paper: #171512;
    --panel: #221F1A;
    --ink: #F1EADA;
    --ink-soft: #B9AF9B;
    --line: #3A3328;
    --gold: #D9A94A;
    --gold-soft: #3A2F1C;
    --teal: #74A896;
    --rust: #D97B69;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--paper);
    background-image: repeating-linear-gradient(
      180deg,
      transparent,
      transparent 27px,
      var(--line) 28px
    );
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    min-height: 100%;
  }
  .board {
    width: 100%;
    max-width: 440px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 1px 0 var(--line), 0 18px 40px -28px rgba(27, 42, 65, 0.35);
    padding: 32px 28px 26px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 26px;
    margin: 0;
    letter-spacing: 0.2px;
  }
  .ticker {
    font-size: 12.5px;
    color: var(--ink-soft);
    text-align: right;
    line-height: 1.4;
    min-height: 17px;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 110px;
    gap: 10px;
    align-items: stretch;
  }
  .field {
    border: 1px solid var(--line);
    border-radius: 3px;
    background: transparent;
    padding: 10px 12px;
    transition: border-color 0.15s ease;
  }
  .field:focus-within {
    border-color: var(--gold);
  }
  .field label {
    display: block;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 2px;
  }
  input#amount {
    width: 100%;
    border: none;
    background: transparent;
    color: var(--ink);
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 500;
    outline: none;
    padding: 0;
  }
  .result-value {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 500;
    line-height: 1.2;
    min-height: 29px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  select {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--panel);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 10px 8px;
    cursor: pointer;
    outline: none;
  }
  select:focus {
    border-color: var(--gold);
  }
  .swap-row {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 6px 0;
  }
  .swap-row::before,
  .swap-row::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  #swap {
    flex: none;
    width: 34px;
    height: 34px;
    margin: 0 12px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--teal);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, border-color 0.15s ease;
  }
  #swap:hover {
    border-color: var(--teal);
  }
  #swap.spin {
    transform: rotate(180deg);
  }
  .status {
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--ink-soft);
    min-height: 16px;
  }
  .status.error {
    color: var(--rust);
  }
  .rate-line {
    margin-top: 4px;
    font-size: 12.5px;
    color: var(--teal);
  }
  @media (max-width: 380px) {
    .row { grid-template-columns: 1fr 92px; }
    input#amount, .result-value { font-size: 20px; }
  }
</style>
</head>
<body>
  <div class="board">
    <header>
      <h1>Exchange</h1>
      <div class="ticker" id="ticker">&nbsp;</div>
    </header>

    <div class="row">
      <div class="field">
        <label for="amount">Amount</label>
        <input id="amount" type="number" inputmode="decimal" value="1" min="0" step="any">
      </div>
      <select id="fromCurrency" aria-label="From currency"></select>
    </div>

    <div class="swap-row">
      <button id="swap" title="Swap currencies" aria-label="Swap currencies">&#8645;</button>
    </div>

    <div class="row">
      <div class="field">
        <label for="resultValue">Converted</label>
        <div class="result-value" id="resultValue">&nbsp;</div>
      </div>
      <select id="toCurrency" aria-label="To currency"></select>
    </div>

    <div class="status" id="status">&nbsp;</div>
  </div>

<script>
(function () {
  var CURRENCIES = {
    USD: "US Dollar", EUR: "Euro", GBP: "British Pound", INR: "Indian Rupee",
    JPY: "Japanese Yen", AUD: "Australian Dollar", CAD: "Canadian Dollar",
    CHF: "Swiss Franc", CNY: "Chinese Yuan", SGD: "Singapore Dollar",
    AED: "UAE Dirham", NZD: "New Zealand Dollar", ZAR: "South African Rand", SEK: "Swedish Krona"
  };

  var amountEl = document.getElementById('amount');
  var fromEl = document.getElementById('fromCurrency');
  var toEl = document.getElementById('toCurrency');
  var resultEl = document.getElementById('resultValue');
  var statusEl = document.getElementById('status');
  var tickerEl = document.getElementById('ticker');
  var swapBtn = document.getElementById('swap');

  function populateSelect(select, selected) {
    Object.keys(CURRENCIES).forEach(function (code) {
      var opt = document.createElement('option');
      opt.value = code;
      opt.textContent = code + ' — ' + CURRENCIES[code];
      if (code === selected) opt.selected = true;
      select.appendChild(opt);
    });
  }

  populateSelect(fromEl, 'USD');
  populateSelect(toEl, 'INR');

  var debounceTimer = null;
  function scheduleConvert() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(convert, 250);
  }

  function formatNumber(n) {
    return n.toLocaleString(undefined, { maximumFractionDigits: 2, minimumFractionDigits: 2 });
  }

  function convert() {
    var amount = parseFloat(amountEl.value);
    var from = fromEl.value;
    var to = toEl.value;

    if (isNaN(amount)) {
      resultEl.textContent = '—';
      statusEl.textContent = 'Enter a valid amount.';
      statusEl.className = 'status error';
      return;
    }

    if (from === to) {
      resultEl.textContent = formatNumber(amount);
      statusEl.textContent = 'Same currency selected.';
      statusEl.className = 'status';
      tickerEl.textContent = '';
      return;
    }

    statusEl.textContent = 'Fetching latest rate…';
    statusEl.className = 'status';

    var url = 'https://api.frankfurter.app/latest?amount=' + encodeURIComponent(amount) +
              '&from=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to);

    fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error('Request failed (' + res.status + ')');
        return res.json();
      })
      .then(function (data) {
        var value = data.rates[to];
        resultEl.textContent = formatNumber(value);
        var rate = value / amount;
        tickerEl.textContent = '1 ' + from + ' = ' + formatNumber(rate) + ' ' + to;
        statusEl.textContent = 'Rates as of ' + data.date + ' · European Central Bank';
        statusEl.className = 'status';
      })
      .catch(function () {
        resultEl.textContent = '—';
        statusEl.textContent = 'Could not fetch rates. Check your connection and try again.';
        statusEl.className = 'status error';
      });
  }

  amountEl.addEventListener('input', scheduleConvert);
  fromEl.addEventListener('change', convert);
  toEl.addEventListener('change', convert);

  swapBtn.addEventListener('click', function () {
    var f = fromEl.value;
    fromEl.value = toEl.value;
    toEl.value = f;
    swapBtn.classList.add('spin');
    setTimeout(function () { swapBtn.classList.remove('spin'); }, 200);
    convert();
  });

  convert();
})();
</script>
</body>
</html>
