<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exchange — Currency Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="board">
    <header>
      <h1>Exchange</h1>
      <div class="ticker" id="ticker">&nbsp;</div>
    </header>

    <div class="row">
      <div class="field">
        <label for="amount">Amount</label>
        <input id="amount" type="number" inputmode="decimal" value="1" min="0" step="any">
      </div>
      <select id="fromCurrency" aria-label="From currency"></select>
    </div>

    <div class="swap-row">
      <button id="swap" title="Swap currencies" aria-label="Swap currencies">&#8645;</button>
    </div>

    <div class="row">
      <div class="field">
        <label for="resultValue">Converted</label>
        <div class="result-value" id="resultValue">&nbsp;</div>
      </div>
      <select id="toCurrency" aria-label="To currency"></select>
    </div>

    <div class="status" id="status">&nbsp;</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
